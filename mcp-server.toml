server_id = "mcp_device_management"
display_name = "Device Management"
version = "1.5.0"
domain = "endpoint-security"
sdk_version = "0.2.0"
risk_level = "medium"
writes_allowed = "gated"
transports = ["stdio"]
credentials = []
governance_gates = ["security_review", "mrtr_approval"]
environments = ["development", "staging", "production"]

[[tools]]
name = "lookup_device"
description = "Look up a device by ID, name, or serial number"
risk_class = "read_only"
requires_approval = false
credential_bindings = []

[[tools]]
name = "list_user_devices"
description = "List all devices owned by a user"
risk_class = "read_only"
requires_approval = false
credential_bindings = []

[[tools]]
name = "get_device_posture"
description = "Get device security posture — encryption, firewall, antivirus, OS patches, compliance state, and risk score"
risk_class = "read_only"
requires_approval = false
credential_bindings = []

[[tools]]
name = "get_installed_apps"
description = "List installed applications on a device"
risk_class = "read_only"
requires_approval = false
credential_bindings = []

[[tools]]
name = "collect_device_logs"
