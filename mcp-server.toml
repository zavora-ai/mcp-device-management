risk_class = "read_only"
requires_approval = false
credential_bindings = []

[[tools]]
name = "run_health_check"
description = "Run a health check on a device — verify encryption, firewall, antivirus, OS patches, and compute risk score"
risk_class = "read_only"
requires_approval = false
credential_bindings = []

[[tools]]
name = "create_device_remediation_task"
